<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>University Helpdesk Bot</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
body {
  margin: 0;
  font-family: 'Roboto', sans-serif;
  background: linear-gradient(to right, #74ebd5, #acb6e5);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}
.chat-container {
  width: 420px;
  background: #ffffff;
  border-radius: 15px;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  display: flex;
  flex-direction: column;
  height: 550px;
}
.chat-header {
  background: #1abc9c;
  color: white;
  padding: 15px;
  font-weight: 500;
  text-align: center;
  font-size: 18px;
}
.chat-box {
  flex: 1;
  overflow-y: auto;
  padding: 15px;
  background: #f0f2f5;
}
.message {
  margin: 8px 0;
  padding: 12px;
  border-radius: 12px;
  max-width: 75%;
  font-size: 14px;
  line-height: 1.4;
}
.user { background: #d0f0fd; align-self: flex-end; }
.bot { background: #d5ffd6; align-self: flex-start; }
.input-area {
  display: flex;
  padding: 10px;
  background: #eee;
}
input {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #ccc;
  outline: none;
}
button {
  margin-left: 10px;
  padding: 12px 20px;
  border: none;
  border-radius: 10px;
  background: #1abc9c;
  color: white;
  font-weight: 500;
  cursor: pointer;
  transition: 0.3s;
}
button:hover { background: #16a085; }
</style>
</head>
<body>
<div class="chat-container">
  <div class="chat-header">🎓 University Helpdesk Bot</div>
  <div class="chat-box" id="chatBox">
    <div class="message bot">👋 Welcome! Please enter your full name to continue.</div>
  </div>
  <div class="input-area">
    <input type="text" id="userInput" placeholder="Type your message...">
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
let userName = null;

async function sendMessage() {
  const input = document.getElementById("userInput");
  const text = input.value.trim();
  if (!text) return;

  const chatBox = document.getElementById("chatBox");

  if (userName) {
    const userMsg = document.createElement("div");
    userMsg.className = "message user";
    userMsg.innerText = text;
    chatBox.appendChild(userMsg);
  } else {
    userName = text; // first input = name
  }

  const res = await fetch("http://127.0.0.1:8000/chat", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({name: userName, text: text})
  });
  const data = await res.json();

  const botMsg = document.createElement("div");
  botMsg.className = "message bot";
  botMsg.innerText = data.reply;
  chatBox.appendChild(botMsg);

  input.value = "";
  chatBox.scrollTop = chatBox.scrollHeight;
}
</script>
</body>
</html>
